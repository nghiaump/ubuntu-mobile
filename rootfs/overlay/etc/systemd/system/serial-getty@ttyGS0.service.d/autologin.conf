# CỬA SAU DEBUG: tự đăng nhập user ubuntu trên serial USB (ACM, /dev/cu.usbmodem* trên Mac).
# Bootloader đã unlock (ai cầm máy cũng `fastboot boot` được) nên không giảm an toàn thực tế.
# Tắt: xoá file này + `systemctl daemon-reload`.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin ubuntu --noclear --keep-baud 115200,57600,38400,9600 - $TERM
