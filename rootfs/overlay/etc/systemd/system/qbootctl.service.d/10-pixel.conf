# Bản gốc chạy ở ~4 s (DefaultDependencies=no) -> exit 0 nhưng KHÔNG đánh dấu slot (UFS/udev chưa sẵn?).
# Chỉ đánh dấu "boot thành công" khi máy thật sự dùng được: sau SSH + NetworkManager, chờ thêm 20 s.
# Thiếu đánh dấu -> ABL hết 3 lượt thử -> rơi về Android slot a (RUNBOOK §6.5).
[Unit]
After=ssh.service NetworkManager.service systemd-udev-settle.service
Wants=ssh.service

[Service]
ExecStartPre=/bin/sleep 20
ExecStartPost=/usr/bin/qbootctl
