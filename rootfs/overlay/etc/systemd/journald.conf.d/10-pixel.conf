# LƯU Ý: systemd KHÔNG cho chú thích cùng dòng với giá trị ("=no  # ..." -> Failed to parse boolean)
[Journal]
Storage=persistent
SystemMaxUse=1G
# ABL ép console=null. Bật "yes" (kèm TTYPath=/dev/tty1) khi cần đẩy log lên màn hình để debug boot không mạng;
# đã có GNOME (Pha 5) nên để "no".
ForwardToConsole=no
TTYPath=/dev/tty1
MaxLevelConsole=info
