# Ẩn nút "Bluetooth Tether(s)" trong Quick Settings GNOME (tài liệu: docs/hardware/connectivity.md).
# gnome-shell (ui/status/network.js, NMBluetoothToggle) chỉ hiện thiết bị NM loại BT khi NM QUẢN LÝ nó; nút này dùng Internet
# của máy đã ghép đôi qua Bluetooth PAN/NAP, dễ nhầm với nút bật Bluetooth và báo "Activation of network connection failed".
# Pixel đã có Wi-Fi -> NM bỏ qua mọi thiết bị Bluetooth. Bluetooth, ghép đôi, nhận file OBEX, âm thanh không bị ảnh hưởng.
# Muốn dùng lại Bluetooth tethering: xoá file này rồi `sudo nmcli general reload conf`.
[device-pixel-no-bt-tether]
match-device=type:bt
managed=0
